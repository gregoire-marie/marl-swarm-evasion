name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.9.21"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Make 'src' importable (no new folders)
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    - name: Run tests
      run: make ci

    - name: Get Coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: coverage
      shell: bash
      run: |
        set -euo pipefail
        test -f coverage.xml
    
        TOTAL="$(python - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse("coverage.xml").getroot()
        print(round(float(root.attrib["line-rate"]) * 100))
        PY
        )"
    
        COLOR="$(python - <<PY
        t = int($TOTAL)
        print("red" if t < 50 else "orange" if t < 70 else "yellow" if t < 85 else "green" if t < 95 else "brightgreen")
        PY
        )"
    
        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "color=$COLOR" >> "$GITHUB_OUTPUT"

    - name: Create Badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 08984c6d4e53525aafa600104ee7070d
        filename: coverage.json
        label: Coverage
        message: ${{ steps.coverage.outputs.total }}%
        color: ${{ steps.coverage.outputs.color }}
